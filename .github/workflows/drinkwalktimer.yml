name: Publish DrinkWalkTimer
on:
  push:
    branches: [main]
    paths:
      - 'DrinkWalkTimer/**'
      - '.github/workflows/drinkwalktimer.yml'
    tags:
      - 'dwt-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drinkwalktimer-publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repository contains several independent addons.
      - name: Configure DrinkWalkTimer package
        shell: bash
        run: |
          cat > .pkgmeta <<'EOF'
          package-as: DrinkWalkTimer
          move-folders:
            DrinkWalkTimer/DrinkWalkTimer: DrinkWalkTimer
          ignore:
            - DotWatch
            - EasyDrip
            - QuickMark
            - .github
            - .DS_Store
            - tests
            - dist
            - build_forever.py
          EOF

      - name: Build without uploading
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d -p 1243353
          pandoc: 'false'

      - name: Verify addon ZIP layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path('.release').glob('*.zip'))
          assert archives, 'No package was built'
          for path in archives:
              with ZipFile(path) as package:
                  names = package.namelist()
                  assert 'DrinkWalkTimer/DrinkWalkTimer.toc' in names, names
                  assert 'DrinkWalkTimer/DrinkWalkTimer.lua' in names, names
                  assert all(name.startswith('DrinkWalkTimer/') for name in names), names
                  assert not any('/' + addon + '/' in name for name in names for addon in ('DotWatch', 'EasyDrip', 'QuickMark')), names
                  assert package.testzip() is None
                  print(path, names)
          PY

      - name: Save downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: DrinkWalkTimer-${{ github.sha }}
          path: .release/*.zip
          if-no-files-found: error
          include-hidden-files: true

      - name: Check publishing token
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Add the CF_API_TOKEN repository secret to enable CurseForge uploads."
            exit 1
          fi

      - name: Build and upload to CurseForge
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -c -p 1243353
          pandoc: 'false'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

